name: R18 Apply Quality Fix
on:
  push:
    branches:
      - review/file17-fresh-20-round-2026-09-06
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-fresh-20-round-2026-09-06
          fetch-depth: 0
      - name: Patch canonical quality gate only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sabri-network/tools/quality-check.sh')
          s=p.read_text(encoding='utf-8')
          a='  tools/quality-check.sh tools/package.sh\n'
          b='  tools/quality-check.sh tools/run-php-test.php tools/package.sh\n'
          if a not in s and b not in s: raise SystemExit('required-tools anchor missing')
          s=s.replace(a,b,1)
          a=' sixth-fresh-twenty-round-contracts.php seventh-fresh-ten-round-contracts.php r15-event-delivery-schema-contracts.php r16-migration-rollback-contracts.php r17-canonical-auth-dual-approval-contracts.php\n)'
          b=' sixth-fresh-twenty-round-contracts.php seventh-fresh-ten-round-contracts.php r15-event-delivery-schema-contracts.php r16-migration-rollback-contracts.php r17-canonical-auth-dual-approval-contracts.php r18-quality-warning-contracts.php\n)'
          if a not in s and b not in s: raise SystemExit('test inventory anchor missing')
          s=s.replace(a,b,1)
          a='for test_file in "${tests[@]}"; do php "tests/$test_file"; done\n'
          b='for test_file in "${tests[@]}"; do php "tools/run-php-test.php" "tests/$test_file"; done\n'
          if a not in s and b not in s: raise SystemExit('test runner anchor missing')
          s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Full warning-fatal regression
        shell: bash
        run: |
          set -euo pipefail
          php -l sabri-network/tools/run-php-test.php
          php -l sabri-network/tests/r18-quality-warning-contracts.php
          bash sabri-network/tools/quality-check.sh
      - name: Commit quality correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/tools/quality-check.sh
          git commit -m 'R18 fix: fail quality gate on PHP runtime warnings'
          git push origin HEAD:review/file17-fresh-20-round-2026-09-06
