name: R6 one-time quality inventory patch
on:
  push:
    branches:
      - review/file17-another-10-round-2026-09-05
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-another-10-round-2026-09-05
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sabri-network/tools/quality-check.sh')
          s=p.read_text(encoding='utf-8')
          needle='tests=(\n static-contracts.php adversarial-contracts.php\n'
          repl='tests=(\n another-fresh-r6-spaces-contracts.php\n static-contracts.php adversarial-contracts.php\n'
          if 'another-fresh-r6-spaces-contracts.php' not in s:
              if needle not in s: raise SystemExit('quality inventory insertion point missing')
              s=s.replace(needle,repl,1)
              p.write_text(s,encoding='utf-8')
          PY
          bash -n sabri-network/tools/quality-check.sh
          if git diff --quiet -- sabri-network/tools/quality-check.sh; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/tools/quality-check.sh
          git commit -m 'R6 regression inventory: invoke spaces fail-closed suite'
          git push origin HEAD:review/file17-another-10-round-2026-09-05
