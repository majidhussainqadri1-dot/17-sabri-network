name: R4 yet-another frozen spaces governance fix
on:
  push:
    branches:
      - review/file17-yet-another-10-round-2026-09-06
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-yet-another-10-round-2026-09-06
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/r4_yet_another_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sabri-network/tests/seventh-fresh-ten-round-contracts.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("&&str_contains($space2,'self::record($id,$actor,'space_settings_updated'')", "&&str_contains($space2,'space_settings_updated')")
          p.write_text(s,encoding='utf-8')
          PY
          for f in sabri-network/includes/class-sn-spaces-part-{2,4,5,9}.php sabri-network/tests/seventh-fresh-ten-round-contracts.php; do php -l "$f"; done
          php sabri-network/tests/seventh-fresh-ten-round-contracts.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-spaces-part-2.php sabri-network/includes/class-sn-spaces-part-4.php sabri-network/includes/class-sn-spaces-part-5.php sabri-network/includes/class-sn-spaces-part-9.php sabri-network/tests/seventh-fresh-ten-round-contracts.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R4 fix: make spaces governance evidence atomic'
          git push origin HEAD:review/file17-yet-another-10-round-2026-09-06