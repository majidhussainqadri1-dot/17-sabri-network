name: File 17 R10 One-Shot Final Correction

on:
  push:
    branches:
      - review/file17-eighth-fresh-10-round-2026-08-31
    paths:
      - .github/scripts/r10-correction.sh
      - .github/workflows/r10-final-correction.yml

permissions:
  contents: write

jobs:
  correct-r10:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen R10 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-eighth-fresh-10-round-2026-08-31
          fetch-depth: 0
      - name: Apply frozen R10 corrections
        run: |
          set -euo pipefail
          sed -i 's/"  sixth-fresh-twenty-round-contracts.php/" sixth-fresh-twenty-round-contracts.php/' .github/scripts/r10-correction.sh
          bash .github/scripts/r10-correction.sh
          python3 - <<'PY'
          from pathlib import Path
          qa=Path('sabri-network/QA-INVENTORY.txt')
          qa.write_text(qa.read_text(encoding='utf-8').replace('all 10 File-17 JavaScript entry points','all 10 JavaScript File-17 entry points'),encoding='utf-8')
          p=Path('sabri-network/tests/eighth-fresh/eighth-fresh-ten-round-contracts.php')
          t=p.read_text(encoding='utf-8')
          t=t.replace('str_contains($integrationPrivacy, "$wpdb->last_error !== \'\'")', 'str_contains($integrationPrivacy, \'$wpdb->last_error !== \\\'\\\'\')')
          t=t.replace('str_contains($firewall, "$remaining = $wpdb->get_var")', 'str_contains($firewall, \'$remaining = $wpdb->get_var\')')
          t=t.replace('str_contains($realtimeR13, "$declared_ready = apply_filters(\'sn_network_file19_notification_adapter_ready\', false)")', 'str_contains($realtimeR13, \'$declared_ready = apply_filters(\\\'sn_network_file19_notification_adapter_ready\\\', false)\')')
          p.write_text(t,encoding='utf-8')
          p=Path('sabri-network/tests/two-plan-completion-contracts.php')
          t=p.read_text(encoding='utf-8')
          old="$check(str_contains($system_status,'47 explicit PHP review suites')&&str_contains($system_status,'8 JavaScript syntax checks'),'Current system-status QA inventory must match the executable quality gate.');"
          new="$check(str_contains($system_status,'54 PHP review suites')&&str_contains($system_status,'10 JavaScript entry-point syntax checks'),'Current system-status QA inventory must match the executable quality gate.');"
          if old not in t: raise SystemExit('historical QA inventory contract anchor missing')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify corrected sources and permanent R10 contracts
        run: |
          set -euo pipefail
          php -l sabri-network/includes/class-sn-round20-correction.php
          php -l sabri-network/includes/class-sn-fourth-fresh-lifecycle-hardening.php
          php -l sabri-network/tests/eighth-fresh/eighth-fresh-ten-round-contracts.php
          php -l sabri-network/tests/two-plan-completion-contracts.php
          node --check sabri-network/assets/js/round20-correction.js
          bash -n sabri-network/tools/quality-check.sh
          php sabri-network/tests/eighth-fresh/eighth-fresh-ten-round-contracts.php
          bash sabri-network/tools/quality-check.sh
      - name: Commit durable R10 corrections only
        run: |
          set -euo pipefail
          git rm -f .github/scripts/r10-correction.sh .github/workflows/r10-final-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'File 17 eighth review R10: final integrated fail-closed closure'
          git push origin HEAD:review/file17-eighth-fresh-10-round-2026-08-31
