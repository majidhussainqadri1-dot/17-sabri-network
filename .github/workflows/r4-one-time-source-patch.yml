name: R4 one-time lifecycle source patch

on:
  push:
    branches:
      - review/file17-another-10-round-2026-09-05

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-another-10-round-2026-09-05
          fetch-depth: 0
      - name: Apply exact frozen R4 correction and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/r4_patch.py
          python3 .github/r4_regression.py
          php -l sabri-network/includes/class-sn-two-plan-completion.php
          php -l sabri-network/includes/class-sn-safety-runtime-hardening.php
          php -l sabri-network/tests/fifth-fresh-closure-contracts.php
          if git diff --quiet -- sabri-network/includes/class-sn-two-plan-completion.php sabri-network/includes/class-sn-safety-runtime-hardening.php sabri-network/tests/fifth-fresh-closure-contracts.php; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-two-plan-completion.php sabri-network/includes/class-sn-safety-runtime-hardening.php sabri-network/tests/fifth-fresh-closure-contracts.php
          git commit -m 'R4 regression: protect lifecycle retention and recovery'
          git push origin HEAD:review/file17-another-10-round-2026-09-05
