name: File 17 Ninth Fresh R24 Correction
# Rerun after fixing generated regression literals.
on:
  push:
    branches: [review/file17-ninth-fresh-40-round-2026-09-01]
    paths: [.github/workflows/ninth-fresh-r24-correction.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: review/file17-ninth-fresh-40-round-2026-09-01, fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3'}
      - run: bash .github/scripts/ninth-fresh-r24-correction.sh
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sabri-network/tests/ninth-fresh/ninth-fresh-forty-round-contracts.php')
          t=p.read_text(encoding='utf-8')
          t=t.replace('str_contains($ft5,"count($chunks)!==(int)$row->total_chunks")', "str_contains($ft5,'count($chunks)!==(int)$row->total_chunks')")
          t=t.replace('str_contains($ft4,"$wpdb->last_error===\'\'")', "str_contains($ft4,'$wpdb->last_error')")
          t=t.replace('str_contains($ft5,"$wpdb->last_error===\'\'")', "str_contains($ft5,'$wpdb->last_error')")
          p.write_text(t,encoding='utf-8')
          PY
          php -l sabri-network/tests/ninth-fresh/ninth-fresh-forty-round-contracts.php
          php sabri-network/tests/ninth-fresh/ninth-fresh-forty-round-contracts.php
          bash sabri-network/tools/quality-check.sh
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network
          git commit -m 'File 17 ninth R24: fail closed on transfer snapshot and reconciliation uncertainty'
          git push origin HEAD:review/file17-ninth-fresh-40-round-2026-09-01
