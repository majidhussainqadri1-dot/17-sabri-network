name: R3 one-time privacy source patch

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-another-10-round-2026-09-05
          fetch-depth: 0
      - name: Apply exact frozen R3 correction script
        run: python3 .github/r3_patch.py
      - name: Commit exact source corrections
        shell: bash
        run: |
          set -euo pipefail
          php -l sabri-network/includes/class-sn-privacy-runtime-hardening.php
          php -l sabri-network/includes/class-sn-sixth-fresh-privacy-hardening.php
          php -l sabri-network/includes/class-sn-r9-runtime-hardening.php
          if git diff --quiet -- sabri-network/includes/class-sn-privacy-runtime-hardening.php sabri-network/includes/class-sn-sixth-fresh-privacy-hardening.php sabri-network/includes/class-sn-r9-runtime-hardening.php; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-privacy-runtime-hardening.php sabri-network/includes/class-sn-sixth-fresh-privacy-hardening.php sabri-network/includes/class-sn-r9-runtime-hardening.php
          git commit -m 'R3 fix: fail closed privacy read and completion truth'
          git push origin HEAD:review/file17-another-10-round-2026-09-05
