name: File 17 Quality

on:
  push:
    branches:
      - main
      - codex/file-17-review-2.0.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Materialize verified safety batch when present
        id: materialize
        if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/file-17-review-2.0.0') || (github.event_name == 'pull_request' && github.head_ref == 'codex/file-17-review-2.0.0')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f batch3-payload/READY ]]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat batch3-payload/part-*.b64 | base64 -d > /tmp/file17-batch3.tar.xz
          echo '69ddc17fc0de69b794ad3812c55d299156d03a9e6448395e3332eaf890e0eb6a  /tmp/file17-batch3.tar.xz' | sha256sum -c -
          mkdir -p /tmp/file17-batch3
          tar -xJf /tmp/file17-batch3.tar.xz -C /tmp/file17-batch3
          test -f /tmp/file17-batch3/sabri-network/includes/class-sn-safety.php
          cp -a /tmp/file17-batch3/. .
          rm -rf batch3-payload
          echo 'present=true' >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync zip
      - name: Run quality checks
        run: bash sabri-network/tools/quality-check.sh
      - name: Build package
        run: bash sabri-network/tools/package.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: file-17-sabri-network-messages-2.0.0
          path: |
            sabri-network/build/17-sabri-network-and-messages-2.0.0.zip
            sabri-network/build/17-sabri-network-and-messages-2.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Commit verified safety batch
        if: steps.materialize.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: harden report safety retention and privacy'
          git push origin HEAD:codex/file-17-review-2.0.0
