name: File 17 Quality

on:
  push:
    branches:
      - main
      - codex/**
      - review/**
      - complete/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  minimum-php-contract:
    name: PHP 8.1 syntax and current boundary contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up declared minimum PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.1'
          coverage: none
          tools: none
      - name: Lint all PHP and run current boundary suites
        run: |
          set -euo pipefail
          mapfile -t files < <(find sabri-network -type f -name '*.php' -not -path '*/build/*' -print | sort)
          test "${#files[@]}" -ge 80
          for file in "${files[@]}"; do
            if ! output="$(php -l "$file" 2>&1)"; then
              printf '::error file=%s::%s\n' "$file" "${output//$'\n'/'%0A'}"
              exit 1
            fi
          done
          node --check sabri-network/assets/js/future-superset.js
          node --check sabri-network/assets/js/fifth-fresh-ui.js
          python3 - <<'PY'
          from pathlib import Path
          css=Path('sabri-network/assets/css/future-superset.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}')
          assert 'prefers-reduced-motion' in css and '44px' in css and '#087a4e' in css
          green=Path('sabri-network/assets/css/brand-green-overrides.css').read_text(encoding='utf-8').lower()
          assert green.count('{') == green.count('}')
          assert '#087a4e' in green and '#ff8a1f' in green
          PY
          run_test() {
            local file="$1" output
            if ! output="$(php "sabri-network/tests/$file" 2>&1)"; then
              printf '::error file=sabri-network/tests/%s::%s\n' "$file" "${output//$'\n'/'%0A'}"
              exit 1
            fi
            printf '%s\n' "$output"
          }
          run_test cf01-clinical-context-static-contracts.php
          run_test cf01-clinical-context-runtime-contracts.php
          run_test smail-static-contracts.php
          run_test smail-adversarial-contracts.php
          run_test transfer-static-contracts.php
          run_test transfer-adversarial-contracts.php
          run_test four-plan-review-1-governance-contracts.php
          run_test four-plan-review-2-transfer-concurrency-contracts.php
          run_test four-plan-review-3-message-smail-security-contracts.php
          run_test four-plan-review-4-fresh-release-contracts.php
          run_test forty-round-review-1-governance-identity-crypto-contracts.php
          run_test forty-round-review-2-transfer-smail-privacy-contracts.php
          run_test forty-round-review-3-canonical-safety-resilience-contracts.php
          run_test forty-round-review-4-release-truth-contracts.php
          run_test two-plan-completion-contracts.php
          run_test future24-forty-round-corrective-static-contracts.php
          run_test fourth-fresh-twenty-round-contracts.php
          run_test fifth-fresh-twenty-round-contracts.php
          run_test fifth-fresh-migration-contracts.php
          run_test fifth-fresh-closure-contracts.php
          run_test fifth-fresh-release-truth-contracts.php
          run_test sixth-fresh-twenty-round-contracts.php

  quality-and-package:
    name: PHP 8.3 full quality and deterministic package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Verify packaging dependencies
        run: |
          set -euo pipefail
          if ! command -v zip >/dev/null 2>&1 || ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip rsync
          fi
          command -v zip
          command -v rsync
      - name: Run full quality gate
        run: |
          set -o pipefail
          node --check sabri-network/assets/js/future-superset.js
          node --check sabri-network/assets/js/fifth-fresh-ui.js
          if ! bash sabri-network/tools/quality-check.sh 2>&1 | tee /tmp/file17-quality.log; then
            tail -n 80 /tmp/file17-quality.log | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error file=sabri-network\/tools\/quality-check.sh::/'
            exit 1
          fi
          php sabri-network/tests/future24-forty-round-corrective-static-contracts.php
          php sabri-network/tests/fourth-fresh-twenty-round-contracts.php
          php sabri-network/tests/fifth-fresh-twenty-round-contracts.php
          php sabri-network/tests/fifth-fresh-migration-contracts.php
          php sabri-network/tests/fifth-fresh-closure-contracts.php
          php sabri-network/tests/fifth-fresh-release-truth-contracts.php
          php sabri-network/tests/sixth-fresh-twenty-round-contracts.php
      - name: Upload governed 2.1.0 candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file-17-complete-2.1.0-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            sabri-network/build/17-sabri-network-and-messages-2.1.0.zip
            sabri-network/build/17-sabri-network-and-messages-2.1.0.zip.sha256
            sabri-network/build/17-sabri-network-and-messages-2.1.0.manifest.sha256
          if-no-files-found: error
          retention-days: 14
