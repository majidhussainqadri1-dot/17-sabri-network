name: Materialize Verified File 17 Corrective Batch

on:
  push:
    branches:
      - codex/file-17-review-2.0.0
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.head_ref == 'codex/file-17-review-2.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled review branch
        uses: actions/checkout@v4
        with:
          ref: codex/file-17-review-2.0.0
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install verification and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync zip xz-utils

      - name: Verify and materialize corrective batch
        shell: bash
        run: |
          set -euo pipefail
          cat batch5-payload/part-*.b64 | base64 -d > /tmp/file17-batch5.tar.xz
          echo '3e9d47f4998e55c9dcf66a8a371ce1aeafe54de752758c76fb3a877bce884760  /tmp/file17-batch5.tar.xz' | sha256sum -c -
          xz -t /tmp/file17-batch5.tar.xz
          tar -xJf /tmp/file17-batch5.tar.xz -C .
          test -f sabri-network/includes/class-sn-relationships.php
          test -f sabri-network/tests/relationships-adversarial-contracts.php
          rm -rf batch4-payload batch5-payload
          rm -f .github/workflows/materialize-batch4.yml
          bash sabri-network/tools/quality-check.sh

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: file-17-sabri-network-messages-2.0.0-corrective-batch
          path: |
            sabri-network/build/17-sabri-network-and-messages-2.0.0.zip
            sabri-network/build/17-sabri-network-and-messages-2.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified corrective batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: harden safety and add canonical follow graph'
          git push origin HEAD:codex/file-17-review-2.0.0
