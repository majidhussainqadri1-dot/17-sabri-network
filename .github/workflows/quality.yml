name: File 17 Quality

on:
  push:
    branches:
      - main
      - codex/file-17-review-2.0.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}
          fetch-depth: 1
      - name: Materialize Sabri Meet coding batch
        id: materialize
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/file-17-review-2.0.0'
        run: |
          if [[ ! -d .github/sabri-meet-payload ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat .github/sabri-meet-payload/chunk-* | base64 -d > /tmp/file17-meet-batch.tar.xz
          echo "d34d70f1255ba1b3471ab6c1f738e1aa8ca8b9e1be5746a3835e012d047b1756  /tmp/file17-meet-batch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/file17-meet-batch.tar.xz -C .
          chmod +x sabri-network/tools/quality-check.sh sabri-network/tools/package.sh
          rm -rf .github/sabri-meet-payload
          rm -f .github/workflows/materialize-sabri-meet.yml
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync zip
      - name: Run quality checks
        run: bash sabri-network/tools/quality-check.sh
      - name: Build package
        run: bash sabri-network/tools/package.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: file-17-sabri-network-messages-2.0.0
          path: |
            sabri-network/build/17-sabri-network-and-messages-2.0.0.zip
            sabri-network/build/17-sabri-network-and-messages-2.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Commit materialized Sabri Meet coding
        if: steps.materialize.outputs.changed == 'true'
        run: |
          rm -rf sabri-network/build
          cat > .github/workflows/quality.yml <<'YAML'
          name: File 17 Quality

          on:
            push:
              branches:
                - main
                - codex/file-17-review-2.0.0
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: shivammathur/setup-php@v2
                  with:
                    php-version: '8.3'
                    coverage: none
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Install packaging dependencies
                  run: sudo apt-get update && sudo apt-get install -y rsync zip
                - name: Run quality checks
                  run: bash sabri-network/tools/quality-check.sh
                - name: Build package
                  run: bash sabri-network/tools/package.sh
                - name: Upload package
                  uses: actions/upload-artifact@v4
                  with:
                    name: file-17-sabri-network-messages-2.0.0
                    path: |
                      sabri-network/build/17-sabri-network-and-messages-2.0.0.zip
                      sabri-network/build/17-sabri-network-and-messages-2.0.0.zip.sha256
                    if-no-files-found: error
                    retention-days: 14
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement Sabri Meet with four review and fix rounds"
          git push origin HEAD:codex/file-17-review-2.0.0
