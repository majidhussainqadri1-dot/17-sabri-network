name: File 17 Materialize Review 3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'codex/file-17-review-2.0.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-17-review-2.0.0
          fetch-depth: 1
      - name: Materialize reviewed corrections
        run: |
          cat .github/materialize-parts/part-* | base64 -d | gzip -d > /tmp/materialize-review-3.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/materialize-review-3.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'ROOT=Path.cwd()': "REPO=Path.cwd()\nROOT=REPO/'sabri-network'",
              "ROOT/'sabri-network/tests/": "ROOT/'tests/",
              'p=ROOT/rel': 'p=REPO/rel',
              "manifest=ROOT/'MANIFEST.md'": "manifest=REPO/'MANIFEST.md'",
              "for p in (ROOT/'sabri-network').rglob('*'):": "for p in ROOT.rglob('*'):",
              'rel=p.relative_to(ROOT).as_posix()': 'rel=p.relative_to(REPO).as_posix()',
              "hashlib.sha256((ROOT/r).read_bytes())": "hashlib.sha256((REPO/r).read_bytes())",
              "(ROOT/'CHECKSUMS.sha256')": "(REPO/'CHECKSUMS.sha256')",
              "(ROOT/'.github/workflows/quality.yml')": "(REPO/'.github/workflows/quality.yml')",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Materializer patch anchor missing: {old}')
              s = s.replace(old, new)
          helper_wrong = "def replace_once(rel, old, new):\n    p=REPO/rel"
          helper_right = "def replace_once(rel, old, new):\n    p=ROOT/rel"
          if helper_wrong not in s:
              raise SystemExit('Materializer helper repair anchor missing')
          s = s.replace(helper_wrong, helper_right, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python /tmp/materialize-review-3.py
          rm -rf .github/materialize-parts
      - name: Commit corrected review batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix File 17 third forensic review findings"
          git push origin HEAD:codex/file-17-review-2.0.0
