name: File 17 Materialize Review 3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'codex/file-17-review-2.0.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-17-review-2.0.0
          fetch-depth: 1
      - name: Materialize reviewed corrections
        run: |
          cat .github/materialize-parts/part-* | base64 -d | gzip -d > /tmp/materialize-review-3.py
          python /tmp/materialize-review-3.py
          rm -rf .github/materialize-parts
      - name: Commit corrected review batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix File 17 third forensic review findings"
          git push origin HEAD:codex/file-17-review-2.0.0
