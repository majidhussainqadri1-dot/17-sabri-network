name: File 17 Quality

on:
  push:
    branches:
      - main
      - codex/file-17-review-2.0.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
      - name: Materialize Sabri Meet coding batch
        id: materialize
        if: (github.event_name == 'push' && github.ref == 'refs/heads/codex/file-17-review-2.0.0') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/file-17-review-2.0.0')
        run: |
          if [[ ! -d .github/sabri-meet-payload ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat <<'SUMS' | sha256sum -c -
          716001fc76669b2df249e550b90b5f45ac3a35a22c60fdff09804f25f31a34d6  .github/sabri-meet-payload/chunk-00
          b4a658a1126f13c79193e4bb073237bfb3501cf5cf6d130a273079d1738e0dd2  .github/sabri-meet-payload/chunk-01
          9d96272ddab51386d974d2aed5079ac5174d2ee24ca0ab404e2ebe7cf979988f  .github/sabri-meet-payload/chunk-02
          43a45604936b7749b3f3c50c463c49cfc7afb4fec929bf84ee83ac59ebfff84f  .github/sabri-meet-payload/chunk-03a
          46492ca9ec4c8ceb9e4f58421a9ef51e7139364b1624a6f1e39c84ef59ceee59  .github/sabri-meet-payload/chunk-03b
          8a898611ec5f7516869e9eb01c386db132142ad05ef032fc602efeb5ca7432f9  .github/sabri-meet-payload/chunk-04
          e051fd09ce301e68b487e099f75f8913d50db01209ba05822f2b726d38f2fdbc  .github/sabri-meet-payload/chunk-05
          afc4f2c1cc7d8d5039c0938518196f06470b74bff51e12cc772454b0649d18c1  .github/sabri-meet-payload/chunk-06
          6f167f7425fa5a20af18e727677335e35abfced2b0ba232cc96754627fdc049f  .github/sabri-meet-payload/chunk-07
          SUMS
          cat .github/sabri-meet-payload/chunk-* | base64 -d > /tmp/file17-meet-batch.tar.xz
          echo "d34d70f1255ba1b3471ab6c1f738e1aa8ca8b9e1be5746a3835e012d047b1756  /tmp/file17-meet-batch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/file17-meet-batch.tar.xz -C .
          chmod +x sabri-network/tools/quality-check.sh sabri-network/tools/package.sh
          rm -rf .github/sabri-meet-payload
          rm -f .github/workflows/materialize-sabri-meet.yml
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync zip
      - name: Run quality checks
        run: bash sabri-network/tools/quality-check.sh
      - name: Build package
        run: bash sabri-network/tools/package.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: file-17-sabri-network-messages-2.0.0
          path: |
            sabri-network/build/17-sabri-network-and-messages-2.0.0.zip
            sabri-network/build/17-sabri-network-and-messages-2.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Commit materialized Sabri Meet coding
        if: steps.materialize.outputs.changed == 'true'
        run: |
          rm -rf sabri-network/build
          cat > .github/workflows/quality.yml <<'YAML'
          name: File 17 Quality

          on:
            push:
              branches:
                - main
                - codex/file-17-review-2.0.0
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: shivammathur/setup-php@v2
                  with:
                    php-version: '8.3'
                    coverage: none
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Install packaging dependencies
                  run: sudo apt-get update && sudo apt-get install -y rsync zip
                - name: Run quality checks
                  run: bash sabri-network/tools/quality-check.sh
                - name: Build package
                  run: bash sabri-network/tools/package.sh
                - name: Upload package
                  uses: actions/upload-artifact@v4
                  with:
                    name: file-17-sabri-network-messages-2.0.0
                    path: |
                      sabri-network/build/17-sabri-network-and-messages-2.0.0.zip
                      sabri-network/build/17-sabri-network-and-messages-2.0.0.zip.sha256
                    if-no-files-found: error
                    retention-days: 14
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement Sabri Meet with four review and fix rounds"
          git push origin HEAD:codex/file-17-review-2.0.0
