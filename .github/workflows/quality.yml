name: File 17 Quality

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  minimum-php-contract:
    name: PHP 8.1 syntax, governance, Smail, transfer and Top-20 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up declared minimum PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.1'
          coverage: none
          tools: none
      - name: Lint all PHP and run critical boundary suites
        run: |
          set -euo pipefail
          mapfile -t files < <(find sabri-network -type f -name '*.php' -not -path '*/build/*' -print | sort)
          test "${#files[@]}" -ge 80
          for file in "${files[@]}"; do php -l "$file"; done
          php sabri-network/tests/static-contracts.php
          php sabri-network/tests/cf01-clinical-context-static-contracts.php
          php sabri-network/tests/cf01-clinical-context-runtime-contracts.php
          php sabri-network/tests/smail-static-contracts.php
          php sabri-network/tests/smail-adversarial-contracts.php
          php sabri-network/tests/transfer-static-contracts.php
          php sabri-network/tests/transfer-adversarial-contracts.php
          php sabri-network/tests/four-plan-review-1-governance-contracts.php
          php sabri-network/tests/four-plan-review-2-top20-functional-contracts.php
          php sabri-network/tests/four-plan-review-3-security-adversarial-contracts.php
          php sabri-network/tests/four-plan-review-4-release-truth-contracts.php

  quality-and-package:
    name: PHP 8.3 full quality and deterministic package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y zip rsync
      - name: Run full quality gate
        run: bash sabri-network/tools/quality-check.sh
      - name: Upload governed 2.1.0 candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file-17-complete-2.1.0-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            sabri-network/build/17-sabri-network-and-messages-2.1.0.zip
            sabri-network/build/17-sabri-network-and-messages-2.1.0.zip.sha256
            sabri-network/build/17-sabri-network-and-messages-2.1.0.manifest.sha256
          if-no-files-found: error
          retention-days: 14
