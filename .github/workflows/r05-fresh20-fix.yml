name: R05 fresh20 frozen fix
on:
  push:
    branches:
      - review/file17-fresh-20-round-2026-09-07
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-fresh-20-round-2026-09-07
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/r05_fresh20_patch.py
          python3 .github/r05_fresh20_patch_v2.py
          php -l sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php
          php -l sabri-network/includes/class-sn-file-transfer-part-2.php
          php -l sabri-network/includes/class-sn-file-transfer-part-3.php
          php -l sabri-network/tests/transfer-adversarial-contracts.php
          php -l sabri-network/tests/fifth-fresh-migration-contracts.php
          php -l sabri-network/tests/seventh-fresh-ten-round-contracts.php
          php sabri-network/tests/transfer-adversarial-contracts.php
          php sabri-network/tests/fifth-fresh-migration-contracts.php
          php sabri-network/tests/seventh-fresh-ten-round-contracts.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php sabri-network/includes/class-sn-file-transfer-part-2.php sabri-network/includes/class-sn-file-transfer-part-3.php sabri-network/tests/transfer-adversarial-contracts.php sabri-network/tests/fifth-fresh-migration-contracts.php sabri-network/tests/seventh-fresh-ten-round-contracts.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R05 fix: serialize version truth and revalidate transfer mutations'
          git push origin HEAD:review/file17-fresh-20-round-2026-09-07
