name: Materialize File 17 Source

on:
  pull_request:
    branches:
      - main
    paths:
      - 'source-packages/base64/**'
      - 'tools/reconstruct-source-package.sh'
      - '.github/workflows/materialize-source.yml'

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified source package
        shell: bash
        run: |
          set -euo pipefail
          bash tools/reconstruct-source-package.sh

      - name: Extract source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sabri-network
          unzip -q source-packages/17-sabri-network-1.1.0.zip
          test -f sabri-network/sabri-network.php
          grep -q 'Version: 1.1.0' sabri-network/sabri-network.php

      - name: Validate baseline source
        shell: bash
        run: |
          set -euo pipefail
          find sabri-network -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check sabri-network/assets/js/network.js

      - name: Upload verified source artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-17-source-baseline
          path: |
            sabri-network
            source-packages/17-sabri-network-1.1.0.zip
          if-no-files-found: error
          retention-days: 7
