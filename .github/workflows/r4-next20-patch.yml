name: R4 next20 one-time correction patch
on:
  push:
    branches:
      - review/file17-next-20-round-2026-09-06
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-next-20-round-2026-09-06
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/r4_next20_patch.py
          php -l sabri-network/includes/class-sn-message-search.php
          php -l sabri-network/includes/class-sn-message-operations.php
          php sabri-network/tests/next20-contracts.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-message-search.php sabri-network/includes/class-sn-message-operations.php sabri-network/tests/next20-contracts.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R4 fix: fail closed search visibility and organization truth'
          git push origin HEAD:review/file17-next-20-round-2026-09-06
