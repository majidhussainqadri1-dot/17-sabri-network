name: File 17 Eleventh Fresh R3 Correction
on:
  push:
    branches:
      - review/file17-eleventh-fresh-10-round-2026-09-02
    paths:
      - .github/scripts/eleventh-fresh-r3-correction.py
      - .github/workflows/eleventh-fresh-r3-correction.yml
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-eleventh-fresh-10-round-2026-09-02
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Apply frozen R3 correction batch
        run: |
          set -euo pipefail
          python3 .github/scripts/eleventh-fresh-r3-correction.py
          php -l sabri-network/includes/class-sn-relationships.php
          php -l sabri-network/tests/eleventh-fresh/eleventh-fresh-ten-round-contracts.php
          php sabri-network/tests/eleventh-fresh/eleventh-fresh-ten-round-contracts.php
          bash sabri-network/tools/quality-check.sh
      - name: Commit native R3 correction and regression
        run: |
          set -euo pipefail
          git config user.name 'file17-review-bot'
          git config user.email 'file17-review-bot@users.noreply.github.com'
          git add sabri-network/includes/class-sn-relationships.php sabri-network/tests/eleventh-fresh/eleventh-fresh-ten-round-contracts.php
          git diff --cached --quiet && exit 1
          git commit -m 'File 17 eleventh R3: preserve relationship storage truth'
          git push origin HEAD:review/file17-eleventh-fresh-10-round-2026-09-02
