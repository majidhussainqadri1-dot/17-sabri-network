name: Materialize File 17 Follow Batch

on:
  push:
    branches:
      - codex/file-17-review-2.0.0
    paths:
      - 'batch4-payload/READY'
  pull_request:
    branches:
      - main
    types:
      - ready_for_review
    paths:
      - 'batch4-payload/**'
      - '.github/workflows/materialize-batch4.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.head_ref == 'codex/file-17-review-2.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: codex/file-17-review-2.0.0
          fetch-depth: 0

      - name: Reconstruct and verify coding batch
        shell: bash
        run: |
          set -euo pipefail
          cat batch4-payload/part-*.b64 | base64 -d > /tmp/file17-batch4.tar.xz
          echo 'afa57e8929eb0cf07c010d7a6d813d91d03a0d6afcfd14bdffd999f6a76e29f9  /tmp/file17-batch4.tar.xz' | sha256sum -c -
          mkdir -p /tmp/file17-batch4
          tar -xJf /tmp/file17-batch4.tar.xz -C /tmp/file17-batch4
          test -f /tmp/file17-batch4/sabri-network/includes/class-sn-relationships.php
          cp -a /tmp/file17-batch4/. .
          rm -rf batch4-payload
          bash sabri-network/tools/quality-check.sh

      - name: Commit verified coding batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add canonical follow graph and profile actions'
          git push origin HEAD:codex/file-17-review-2.0.0
