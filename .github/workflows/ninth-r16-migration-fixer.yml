name: Ninth R16 migration verifier fixer

on:
  push:
    branches:
      - review/file17-ninth-fresh-20-round-2026-08-29

permissions:
  contents: write

jobs:
  fix:
    if: "${{ startsWith(github.event.head_commit.message, 'R16: add migration verifier fixer') }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-ninth-fresh-20-round-2026-08-29
          fetch-depth: 0
          persist-credentials: true
      - name: Extend migration verifier to all reviewed owned schemas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php')
          text=p.read_text(encoding='utf-8')
          marker="            'message_search_tokens'=>['message_id','conversation_id','sender_id','token_hash','created_at'],\n"
          additions="            'message_mentions'=>['message_id','conversation_id','mentioned_user_id','mentioned_by','created_at'],\n            'message_pins'=>['conversation_id','message_id','pinned_by','created_at'],\n            'message_stars'=>['user_id','message_id','created_at'],\n            'message_folders'=>['user_id','name','slug','version','updated_at'],\n            'message_folder_items'=>['folder_id','user_id','conversation_id','created_at'],\n            'message_hides'=>['user_id','message_id','hidden_at'],\n"
          if additions not in text:
              if marker not in text: raise SystemExit('message-search verifier marker missing')
              text=text.replace(marker,marker+additions,1)
          marker2="            'conference_providers'=>['provider_key','provider_type','status','version'],\n"
          meet="            'meet_meetings'=>['public_id','host_id','conversation_id','status','version','idempotency_key'],\n            'meet_participants'=>['meeting_id','user_id','role','state','version'],\n            'meet_sessions'=>['meeting_id','user_id','session_hash','state','last_seen_at'],\n            'meet_signals'=>['meeting_id','from_session_id','from_user_id','to_user_id','signal_type','expires_at'],\n            'meet_events'=>['meeting_id','actor_id','event_type','subject_user_id','created_at'],\n"
          if meet not in text:
              if marker2 not in text: raise SystemExit('conference verifier marker missing')
              text=text.replace(marker2,marker2+meet,1)
          p.write_text(text,encoding='utf-8')
          PY
          php -l sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php
          grep -F "'message_hides'=>" sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php >/dev/null
          grep -F "'meet_sessions'=>" sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php >/dev/null
      - name: Commit frozen R16 correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php
          git diff --cached --check
          git commit -m 'R16: verify message-operations and Meet schema ownership'
          git push origin HEAD:review/file17-ninth-fresh-20-round-2026-08-29
