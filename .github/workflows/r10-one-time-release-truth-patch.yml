name: R10 one-time current release truth patch
on:
  push:
    branches:
      - review/file17-another-10-round-2026-09-05
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-another-10-round-2026-09-05
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/r10_patch.py
          bash -n sabri-network/tools/quality-check.sh
          php -l sabri-network/tests/another-fresh-r10-release-truth-contracts.php
          php sabri-network/tests/another-fresh-r10-release-truth-contracts.php
          php sabri-network/tests/fifth-fresh-release-truth-contracts.php
          php sabri-network/tests/forty-round-review-4-release-truth-contracts.php
          php sabri-network/tests/seventh-fresh-ten-round-contracts.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md STATUS.md CODING-COMPLETENESS.md sabri-network/readme.txt sabri-network/CHANGELOG.md sabri-network/CURRENT-CANDIDATE-BOUNDARY.txt sabri-network/QA-INVENTORY.txt sabri-network/tests/fifth-fresh-release-truth-contracts.php sabri-network/tests/forty-round-review-4-release-truth-contracts.php sabri-network/tests/seventh-fresh-ten-round-contracts.php sabri-network/tests/another-fresh-r10-release-truth-contracts.php sabri-network/tools/quality-check.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R10 fix: reconcile current cycle release truth and regression inventory'
          git push origin HEAD:review/file17-another-10-round-2026-09-05
