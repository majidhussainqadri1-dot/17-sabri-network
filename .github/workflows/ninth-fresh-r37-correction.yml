name: File 17 Ninth Fresh R37 Correction
on:
  push:
    branches: [review/file17-ninth-fresh-40-round-2026-09-01]
    paths: [.github/workflows/ninth-fresh-r37-correction.yml, .github/scripts/ninth-fresh-r37-correction.py, .github/scripts/ninth-fresh-r37-testcompat.py]
permissions: {contents: write}
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: review/file17-ninth-fresh-40-round-2026-09-01, fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3'}
      - run: |
          python3 .github/scripts/ninth-fresh-r37-correction.py
          python3 .github/scripts/ninth-fresh-r37-testcompat.py
      - run: |
          php -l sabri-network/includes/class-sn-file-transfer-part-4.php
          php -l sabri-network/includes/class-sn-file-transfer-part-5.php
          php -l sabri-network/includes/class-sn-file-transfer-part-6.php
          php -l sabri-network/includes/class-sn-file-transfer-part-7.php
          php sabri-network/tests/ninth-fresh/ninth-fresh-forty-round-contracts.php
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network
          git commit -m 'File 17 ninth R37: harden transfer authorization and download truth'
          git push origin HEAD:review/file17-ninth-fresh-40-round-2026-09-01
