name: Fresh20 R3 search-state fix
on:
  push:
    branches: [review/file17-fresh-20-round-2026-09-06]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-fresh-20-round-2026-09-06
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/r20_r3_patch.py
          php -l sabri-network/includes/class-sn-fourth-fresh-search-hardening.php
          php sabri-network/tests/seventh-fresh-ten-round-contracts.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-fourth-fresh-search-hardening.php sabri-network/tests/seventh-fresh-ten-round-contracts.php
          git commit -m 'R3 fix: durably publish search rebuild state before destructive reset'
          git push origin HEAD:review/file17-fresh-20-round-2026-09-06
