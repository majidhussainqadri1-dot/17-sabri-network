name: R1 next20 one-time correction patch
on:
  push:
    branches:
      - review/file17-next-20-round-2026-09-06
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-next-20-round-2026-09-06
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/r1_next20_patch.py
          php -l sabri-network/includes/class-sn-activator.php
          php -l sabri-network/includes/class-sn-admin.php
          php -l sabri-network/includes/class-sn-messages.php
          php -l sabri-network/includes/class-sn-file-transfer-part-7.php
          php -l sabri-network/includes/class-sn-smail-part-3.php
          php -l sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php
          php sabri-network/tests/next20-contracts.php
          bash -n sabri-network/tools/quality-check.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-activator.php sabri-network/includes/class-sn-admin.php sabri-network/includes/class-sn-messages.php sabri-network/includes/class-sn-file-transfer-part-7.php sabri-network/includes/class-sn-smail-part-3.php sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php sabri-network/tests/next20-contracts.php sabri-network/tools/quality-check.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R1 fix: fail closed on repair and migration truth'
          git push origin HEAD:review/file17-next-20-round-2026-09-06
