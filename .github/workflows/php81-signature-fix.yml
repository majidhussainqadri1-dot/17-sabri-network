name: One-time PHP 8.1 Signature Fix

on:
  push:
    branches:
      - codex/file17-cf01-clinical-context-2.0.1

permissions:
  contents: write

jobs:
  correct-signatures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file17-cf01-clinical-context-2.0.1
          fetch-depth: 0
      - name: Replace PHP 8.2-only true union signatures
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(find sabri-network/includes sabri-network/templates -type f -name '*.php' -print0)
          files+=(sabri-network/sabri-network.php)
          for file in "${files[@]}"; do
            sed -i -E 's/\):[[:space:]]*true\|/): bool|/g' "$file"
          done
          if grep -RInE --include='*.php' '\):[[:space:]]*true\|' sabri-network/includes sabri-network/templates sabri-network/sabri-network.php; then
            echo 'PHP 8.2-only true union signature remains.' >&2
            exit 1
          fi
          git diff --check
      - name: Commit exact compatibility correction
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No incompatible signatures remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes sabri-network/templates sabri-network/sabri-network.php
          git commit -m 'Restore declared PHP 8.1 signature compatibility'
          git push origin HEAD:codex/file17-cf01-clinical-context-2.0.1
