name: File 17 R10 Final Inventory Count Sync

on:
  push:
    branches:
      - review/file17-eighth-fresh-10-round-2026-08-31
    paths:
      - .github/workflows/r10-count-sync.yml

permissions:
  contents: write

jobs:
  sync-count:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current R10 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-eighth-fresh-10-round-2026-08-31
          fetch-depth: 0
      - name: Synchronize executable review-suite count
        run: |
          set -euo pipefail
          files=(
            sabri-network/QA-INVENTORY.txt
            sabri-network/SYSTEM-STATUS.txt
            sabri-network/tests/eighth-fresh/eighth-fresh-ten-round-contracts.php
            sabri-network/tests/two-plan-completion-contracts.php
          )
          for file in "${files[@]}"; do
            sed -i 's/54 PHP review suites/55 PHP review suites/g' "$file"
          done
          if grep -R --line-number --fixed-strings '54 PHP review suites' sabri-network/QA-INVENTORY.txt sabri-network/SYSTEM-STATUS.txt sabri-network/tests/eighth-fresh/eighth-fresh-ten-round-contracts.php sabri-network/tests/two-plan-completion-contracts.php; then
            echo 'stale 54-suite count remains' >&2
            exit 1
          fi
          grep -q '55 PHP review suites' sabri-network/QA-INVENTORY.txt
          grep -q '55 PHP review suites' sabri-network/SYSTEM-STATUS.txt
          php sabri-network/tests/eighth-fresh/eighth-fresh-ten-round-contracts.php
          php sabri-network/tests/two-plan-completion-contracts.php
          bash sabri-network/tools/quality-check.sh
      - name: Commit count synchronization only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/QA-INVENTORY.txt sabri-network/SYSTEM-STATUS.txt sabri-network/tests/eighth-fresh/eighth-fresh-ten-round-contracts.php sabri-network/tests/two-plan-completion-contracts.php
          git commit -m 'File 17 eighth R10: synchronize final 55-suite inventory truth'
          git push origin HEAD:review/file17-eighth-fresh-10-round-2026-08-31
