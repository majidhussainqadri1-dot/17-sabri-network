name: R2 yet relationship fix
on:
  push:
    branches: [review/file17-yet-another-10-round-2026-09-06]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: review/file17-yet-another-10-round-2026-09-06}
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/r2_yet_patch.py
          php -l sabri-network/includes/class-sn-relationship-runtime-hardening.php
          php -l sabri-network/includes/class-sn-relationships.php
          php sabri-network/tests/relationships-adversarial-contracts.php
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-relationship-runtime-hardening.php sabri-network/includes/class-sn-relationships.php sabri-network/tests/relationships-adversarial-contracts.php
          git commit -m 'R2 fix: fail closed on relationship reconciliation uncertainty'
          git push origin HEAD:review/file17-yet-another-10-round-2026-09-06
