name: R2 one-time CF01 source patch

on:
  push:
    branches:
      - review/file17-another-10-round-2026-09-05

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-another-10-round-2026-09-05
          fetch-depth: 0
      - name: Apply exact frozen R2 correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sabri-network/includes/class-sn-cf01-clinical-context.php')
          s=p.read_text(encoding='utf-8')
          old="        $wpdb->query('START TRANSACTION');\n        try {"
          new="        if ($wpdb->query('START TRANSACTION') === false) {\n            return self::error('sn_cf01_transaction_failed', 'The communication-context reference transaction could not start safely.', 503);\n        }\n        try {"
          if new in s:
              raise SystemExit(0)
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one CF01 transaction-start target')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          if git diff --quiet -- sabri-network/includes/class-sn-cf01-clinical-context.php; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-cf01-clinical-context.php
          git commit -m 'R2 fix: fail closed CF01 transaction start'
          git push origin HEAD:review/file17-another-10-round-2026-09-05
