name: Materialize File 17 Safety Batch

on:
  push:
    branches:
      - codex/file-17-review-2.0.0
    paths:
      - 'batch3-payload/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: codex/file-17-review-2.0.0
          fetch-depth: 0

      - name: Reconstruct and verify coding batch
        shell: bash
        run: |
          set -euo pipefail
          cat batch3-payload/part-*.b64 | base64 -d > /tmp/file17-batch3.tar.xz
          echo '69ddc17fc0de69b794ad3812c55d299156d03a9e6448395e3332eaf890e0eb6a  /tmp/file17-batch3.tar.xz' | sha256sum -c -
          mkdir -p /tmp/file17-batch3
          tar -xJf /tmp/file17-batch3.tar.xz -C /tmp/file17-batch3
          test -f /tmp/file17-batch3/sabri-network/includes/class-sn-safety.php
          cp -a /tmp/file17-batch3/. .
          rm -rf batch3-payload
          bash sabri-network/tools/quality-check.sh

      - name: Commit verified coding batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: harden report safety retention and privacy'
          git push origin HEAD:codex/file-17-review-2.0.0
