name: R15 Event Inventory
on:
  push:
    branches:
      - review/file17-fresh-20-round-2026-09-06
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Inventory File-17 outbox producers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SN_Outbox::enqueue call sites ==='
          grep -RFn --include='*.php' 'SN_Outbox::enqueue' sabri-network || true
          echo '=== Event type literals passed to enqueue ==='
          python3 - <<'PY'
          import pathlib,re
          found=[]
          for p in pathlib.Path('sabri-network').rglob('*.php'):
              s=p.read_text(encoding='utf-8',errors='replace')
              for m in re.finditer(r"SN_Outbox::enqueue\(\s*(['\"])([^'\"]+)\1",s):
                  found.append((m.group(2),str(p)))
          for event,path in sorted(set(found)):
              print(f'{event}\t{path}')
          print(f'TOTAL={len(set(found))}')
          PY
