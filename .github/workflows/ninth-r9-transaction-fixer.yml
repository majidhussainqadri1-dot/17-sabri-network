name: Ninth R9 transaction fixer

on:
  push:
    branches:
      - review/file17-ninth-fresh-20-round-2026-08-29

permissions:
  contents: write

jobs:
  fix:
    if: startsWith(github.event.head_commit.message, 'R9: add transaction fixer')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-ninth-fresh-20-round-2026-08-29
          fetch-depth: 0
          persist-credentials: true
      - name: Apply frozen R9 transaction corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          meet = Path('sabri-network/includes/class-sn-meet.php')
          text = meet.read_text(encoding='utf-8')
          start = "$wpdb->query('START TRANSACTION');"
          checked_start = "if ($wpdb->query('START TRANSACTION') === false) { return self::database_error(); }"
          starts = text.count(start)
          if starts < 5:
              raise SystemExit(f'Expected at least 5 unchecked Meet transaction starts, found {starts}')
          text = text.replace(start, checked_start)
          commit = "$wpdb->query('COMMIT');"
          checked_commit = "if ($wpdb->query('COMMIT') === false) { throw new RuntimeException('meet_commit_failed'); }"
          commits = text.count(commit)
          if commits < 5:
              raise SystemExit(f'Expected at least 5 unchecked Meet commits, found {commits}')
          text = text.replace(commit, checked_commit)
          meet.write_text(text, encoding='utf-8')

          provider = Path('sabri-network/includes/class-sn-conference-provider.php')
          p = provider.read_text(encoding='utf-8')
          needle = "$action_id=absint($request->get_param('high_risk_action_id'));$wpdb->query('START TRANSACTION');try{"
          replacement = "$action_id=absint($request->get_param('high_risk_action_id'));if($wpdb->query('START TRANSACTION')===false)return self::error('sn_provider_configuration_failed','The provider configuration transaction could not start safely.',500);try{"
          if needle not in p:
              raise SystemExit('Conference-provider unchecked transaction start was not found exactly once.')
          p = p.replace(needle, replacement, 1)
          provider.write_text(p, encoding='utf-8')
          PY
          php -l sabri-network/includes/class-sn-meet.php
          php -l sabri-network/includes/class-sn-conference-provider.php
          test "$(grep -F -c "\$wpdb->query('START TRANSACTION');" sabri-network/includes/class-sn-meet.php || true)" -eq 0
          test "$(grep -F -c "\$wpdb->query('COMMIT');" sabri-network/includes/class-sn-meet.php || true)" -eq 0
      - name: Commit frozen R9 corrections
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-meet.php sabri-network/includes/class-sn-conference-provider.php
          git diff --cached --check
          git commit -m 'R9: fail closed on Meet and provider transaction boundaries'
          git push origin HEAD:review/file17-ninth-fresh-20-round-2026-08-29
