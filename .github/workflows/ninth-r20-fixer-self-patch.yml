name: Ninth R20 fixer self patch

on:
  push:
    branches:
      - review/file17-ninth-fresh-20-round-2026-08-29

permissions:
  contents: write

jobs:
  patch:
    if: "${{ startsWith(github.event.head_commit.message, 'R20: patch ninth closure fixer matcher') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-ninth-fresh-20-round-2026-08-29
          fetch-depth: 0
          persist-credentials: true
      - name: Correct the frozen R20 matcher and retrigger
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ninth-r20-closure-fixer.yml')
          text=p.read_text(encoding='utf-8')
          old="r'Eighth fresh 20-round sequential cycle:.*?Current coded domains continue to include:'"
          new="r'Eighth fresh 20-round sequential cycle:.*?Current coded domains continue to include'"
          if old not in text:
              raise SystemExit('target matcher not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ninth-r20-closure-fixer.yml
          git diff --cached --check
          git commit -m 'R20: add ninth release-truth closure fixer v2'
          git push origin HEAD:review/file17-ninth-fresh-20-round-2026-08-29
