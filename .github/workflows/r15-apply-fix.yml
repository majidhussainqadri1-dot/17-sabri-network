name: R15 Apply Frozen Event Fixes
on:
  push:
    branches:
      - review/file17-fresh-20-round-2026-09-06
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-fresh-20-round-2026-09-06
          fetch-depth: 0
      - name: Patch canonical suite inventory after frozen R15 fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sabri-network/tools/quality-check.sh')
          s=p.read_text(encoding='utf-8')
          needle=' sixth-fresh-twenty-round-contracts.php seventh-fresh-ten-round-contracts.php\n)'
          repl=' sixth-fresh-twenty-round-contracts.php seventh-fresh-ten-round-contracts.php r15-event-delivery-schema-contracts.php\n)'
          if 'r15-event-delivery-schema-contracts.php' not in s:
              if needle not in s:
                  raise SystemExit('quality suite inventory anchor missing')
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          bash -n sabri-network/tools/quality-check.sh
          php sabri-network/tests/r15-event-delivery-schema-contracts.php
      - name: Commit quality inventory correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/tools/quality-check.sh
          git commit -m 'R15 fix: register event schema suite in quality inventory'
          git push origin HEAD:review/file17-fresh-20-round-2026-09-06
