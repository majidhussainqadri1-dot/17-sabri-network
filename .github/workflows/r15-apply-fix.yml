name: R16 Apply Frozen Migration Fixes
on:
  push:
    branches:
      - review/file17-fresh-20-round-2026-09-06
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-fresh-20-round-2026-09-06
          fetch-depth: 0
      - name: Apply frozen R16 fixes
        run: python3 sabri-network/tools/r16-apply-fix.py
      - name: Verify targeted regression
        run: |
          set -euo pipefail
          php -l sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php
          php -l sabri-network/includes/class-sn-activator.php
          php -l sabri-network/tests/r16-migration-rollback-contracts.php
          php sabri-network/tests/r16-migration-rollback-contracts.php
          php sabri-network/tests/fifth-fresh-migration-contracts.php
          bash -n sabri-network/tools/quality-check.sh
      - name: Commit R16 product correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php sabri-network/includes/class-sn-activator.php sabri-network/tests/r16-migration-rollback-contracts.php sabri-network/tools/quality-check.sh
          git commit -m 'R16 fix: harden migration verification and rollback'
          git push origin HEAD:review/file17-fresh-20-round-2026-09-06
