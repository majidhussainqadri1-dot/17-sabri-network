name: R15 Apply Frozen Event Fixes
on:
  push:
    branches:
      - review/file17-fresh-20-round-2026-09-06
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-fresh-20-round-2026-09-06
          fetch-depth: 0
      - name: Apply frozen R15 fixes
        run: |
          python3 sabri-network/tools/r15-apply-fix.py
          python3 sabri-network/tools/r15-fix-test.py
      - name: Verify correction locally
        run: |
          set -euo pipefail
          php -l sabri-network/includes/class-sn-event-schema-registry.php
          php -l sabri-network/includes/class-sn-outbox.php
          php -l sabri-network/sabri-network.php
          php -l sabri-network/tests/r15-event-delivery-schema-contracts.php
          php sabri-network/tests/r15-event-delivery-schema-contracts.php
      - name: Commit product correction only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/sabri-network.php sabri-network/includes/class-sn-outbox.php sabri-network/includes/class-sn-event-schema-registry.php sabri-network/tests/r15-event-delivery-schema-contracts.php
          git commit -m 'R15 fix: fail-closed versioned event delivery contracts'
          git push origin HEAD:review/file17-fresh-20-round-2026-09-06
