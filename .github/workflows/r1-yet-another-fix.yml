name: R1 yet-another frozen migration fix
on:
  push:
    branches:
      - review/file17-yet-another-10-round-2026-09-06
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-yet-another-10-round-2026-09-06
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/r1_yet_another_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sabri-network/tests/seventh-fresh-ten-round-contracts.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"if ($wpdb->query(\'START TRANSACTION\') === false)"','"if (\\$wpdb->query(\'START TRANSACTION\') === false)"')
          p.write_text(s,encoding='utf-8')
          PY
          php -l sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php
          php -l sabri-network/sabri-network.php
          php -l sabri-network/includes/class-sn-central-plan-hardening.php
          php sabri-network/tests/seventh-fresh-ten-round-contracts.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes/class-sn-fifth-fresh-migration-hardening.php sabri-network/sabri-network.php sabri-network/includes/class-sn-central-plan-hardening.php sabri-network/tests/seventh-fresh-ten-round-contracts.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R1 fix: serialize migration truth and plaintext migration atomicity'
          git push origin HEAD:review/file17-yet-another-10-round-2026-09-06
