name: Materialize File 17 Batch 2

on:
  push:
    branches:
      - codex/file-17-review-2.0.0
    paths:
      - 'batch2-payload/**'
      - '.github/workflows/materialize-batch2.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: codex/file-17-review-2.0.0
          fetch-depth: 0

      - name: Detect payload
        id: payload
        shell: bash
        run: |
          if [[ -f batch2-payload/READY ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct, verify and test batch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat batch2-payload/part-*.b64 | base64 -d > /tmp/file17-batch2.tar.xz
          echo '5d9b18e7f47eaf5626e81b96cccc91949d7c8529ff017d9e7aa3c642610d34e4  /tmp/file17-batch2.tar.xz' | sha256sum -c -
          mkdir -p /tmp/file17-batch2
          tar -xJf /tmp/file17-batch2.tar.xz -C /tmp/file17-batch2
          cp -a /tmp/file17-batch2/. .
          rm -rf batch2-payload
          bash sabri-network/tools/quality-check.sh

      - name: Commit verified batch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add realtime presence typing and conversation state hardening'
          git push origin HEAD:codex/file-17-review-2.0.0
