name: File 17 R8 One-Shot Privacy Correction

on:
  push:
    branches:
      - review/file17-eighth-fresh-10-round-2026-08-31

permissions:
  contents: write

jobs:
  correct-r8:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply frozen R8 correction
        run: python3 .github/r8-privacy-fix.py
      - name: Verify PHP and permanent R8 contracts
        run: |
          find sabri-network -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php sabri-network/tests/eighth-fresh/eighth-fresh-ten-round-contracts.php
      - name: Commit durable corrections only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/includes sabri-network/tests/eighth-fresh/eighth-fresh-ten-round-contracts.php
          git rm .github/r8-privacy-fix.py .github/workflows/r8-privacy-correction.yml
          git commit -m 'File 17 eighth review R8: fail closed privacy completion and holds'
          git push origin HEAD:${GITHUB_REF_NAME}
