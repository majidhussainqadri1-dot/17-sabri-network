name: R20 Apply Final Fixes
on:
  push:
    branches:
      - review/file17-fresh-20-round-2026-09-06
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: review/file17-fresh-20-round-2026-09-06
          fetch-depth: 0
      - name: Apply frozen R20 source-gate and historical-truth corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old in s:
                  s=s.replace(old,new,1)
                  p.write_text(s,encoding='utf-8')
                  return
              if new not in s:
                  raise SystemExit(f'anchor missing in {path}: {old!r}')

          q='sabri-network/tools/quality-check.sh'
          replace_once(q,
              "  includes/class-sn-sixth-fresh-privacy-hardening.php\n  templates/network-standalone.php",
              "  includes/class-sn-sixth-fresh-privacy-hardening.php\n  includes/class-sn-next-message-operations-hardening.php includes/class-sn-r6-transaction-hardening.php\n  includes/class-sn-r7-privacy-hardening.php includes/class-sn-r8-interop-finalization-hardening.php\n  includes/class-sn-r9-runtime-hardening.php includes/class-sn-fresh20-r7-message-read-hardening.php\n  templates/network-standalone.php")
          replace_once(q,
              " sixth-fresh-twenty-round-contracts.php seventh-fresh-ten-round-contracts.php r15-event-delivery-schema-contracts.php r16-migration-rollback-contracts.php r17-canonical-auth-dual-approval-contracts.php r18-quality-warning-contracts.php\n)",
              " sixth-fresh-twenty-round-contracts.php seventh-fresh-ten-round-contracts.php r15-event-delivery-schema-contracts.php r16-migration-rollback-contracts.php r17-canonical-auth-dual-approval-contracts.php r18-quality-warning-contracts.php r20-final-cycle-contracts.php\n)")

          p=Path('sabri-network/tests/fifth-fresh-release-truth-contracts.php'); s=p.read_text(encoding='utf-8')
          reps={
              "$currentBranch='review/file17-another-10-round-2026-09-05';":"$historicalBranch='review/file17-another-10-round-2026-09-05';",
              "$currentDefects='R1, R2, R3, R4, R5, R6, R7, R8, R9, R10';":"$historicalDefects='R1, R2, R3, R4, R5, R6, R7, R8, R9, R10';",
              '$currentBranch': '$historicalBranch',
              '$currentDefects': '$historicalDefects',
              'must identify the current completed review branch.':'must retain the historical completed review branch attribution.',
              'must retain current 60-suite/10-JS release truth.':'must retain historical 60-suite/10-JS release attribution.',
              'current release/status surfaces must record the current completed-cycle defect-bearing rounds.':'historical release/status attribution must preserve that completed-cycle defect-bearing record.',
              'current release/status surfaces must retain the completed-cycle R5 record.':'historical release/status attribution must retain the completed-cycle R5 record.'
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          p=Path('sabri-network/tests/fifth-fresh-closure-contracts.php'); s=p.read_text(encoding='utf-8')
          reps={
              '// Current another-fresh Round 10 — standalone package and repository-current truth must fail closed.':'// Historical another-fresh Round 10 — preserve its attribution without governing current truth.',
              "$currentBranch='review/file17-another-10-round-2026-09-05';":"$historicalBranch='review/file17-another-10-round-2026-09-05';",
              "$currentDefectRounds='R1, R2, R3, R4, R5, R6, R7, R8, R9, R10';":"$historicalDefectRounds='R1, R2, R3, R4, R5, R6, R7, R8, R9, R10';",
              '$currentBranch': '$historicalBranch',
              '$currentDefectRounds': '$historicalDefectRounds',
              'Current R10: ':'Historical another R10: ',
              'must identify the current another-fresh branch.':'must retain the historical another-fresh branch attribution.',
              'must retain the current cycle all-ten defect-round truth.':'must retain that historical cycle all-ten defect-round attribution.'
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          p=Path('sabri-network/tests/seventh-fresh-ten-round-contracts.php'); s=p.read_text(encoding='utf-8')
          old="$check(str_contains($workflow,'php sabri-network/tests/seventh-fresh-ten-round-contracts.php'),'R10: PHP 8.3 release job must explicitly execute the seventh-fresh suite after the full quality gate.');"
          new="$check(!str_contains($workflow,'php sabri-network/tests/seventh-fresh-ten-round-contracts.php'),'Historical R10: PHP 8.3 must not retain a weaker direct regression path outside the canonical full quality gate.');"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('seventh workflow assertion anchor missing')
          s=s.replace('readme release truth must match the current explicit QA inventory.','readme must retain the historical 60-suite/10-JS attribution while later current truth is governed separately.')
          s=s.replace('changelog release truth must match the current explicit QA inventory.','changelog must retain the historical 60-suite/10-JS attribution while later current truth is governed separately.')
          s=s.replace('must reflect the current 60-suite/10-JS quality truth.','must retain the historical 60-suite/10-JS quality attribution; later current truth is governed by R20.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check corrected gates
        shell: bash
        run: |
          set -euo pipefail
          bash -n sabri-network/tools/quality-check.sh
          php -l sabri-network/tests/fifth-fresh-release-truth-contracts.php
          php -l sabri-network/tests/fifth-fresh-closure-contracts.php
          php -l sabri-network/tests/seventh-fresh-ten-round-contracts.php
          php -l sabri-network/tests/r20-final-cycle-contracts.php
      - name: Commit frozen R20 corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-network/tools/quality-check.sh sabri-network/tests/fifth-fresh-release-truth-contracts.php sabri-network/tests/fifth-fresh-closure-contracts.php sabri-network/tests/seventh-fresh-ten-round-contracts.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R20 fix: close source gate and historical release semantics'
          git push origin HEAD:review/file17-fresh-20-round-2026-09-06
